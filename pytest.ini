[pytest]
testpaths = tests
pythonpath = .
addopts = -v --html=reports/reporte.html --self-contained-html

# Marcadores para ejecutar subconjuntos de tests (ej: pytest -m api)
markers =
    ui: pruebas de interfaz con Selenium WebDriver
    api: pruebas de API con Requests
    smoke: pruebas críticas y rápidas del camino feliz

# Logs en consola durante la ejecución
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

# Logs guardados en archivo (evidencia de ejecución)
log_file = reports/ejecucion.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
